version: "3.8"

services:
  db:
    image: postgres:16
    container_name: icr_almacen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: icr_almacen
      POSTGRES_USER: icr_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - icr_almacen_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    networks:
      - icr_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: icr_almacen_backend
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: icr_app
      PGPASSWORD: ${DB_PASSWORD:-changeme}
      PGDATABASE: icr_almacen
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el .env antes de desplegar}
      ALLOWED_ORIGIN: https://${DOMAIN:-almacen.icr.example.com}
      # Integraciones opcionales — todas se leen desde el .env de este mismo
      # directorio (docker compose lo carga solo). Sin definir, cada una
      # responde "no configurado" en vez de fallar (ver README).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      RUC_API_URL: ${RUC_API_URL:-}
      RUC_API_TOKEN: ${RUC_API_TOKEN:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - icr_almacen_uploads:/app/uploads
    depends_on:
      - db
    networks:
      - icr_internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.icr-almacen.rule=Host(`${DOMAIN:-almacen.icr.example.com}`)"
      - "traefik.http.routers.icr-almacen.entrypoints=websecure"
      - "traefik.http.routers.icr-almacen.tls.certresolver=letsencrypt"
      - "traefik.http.services.icr-almacen.loadbalancer.server.port=4000"

volumes:
  icr_almacen_data:
  icr_almacen_uploads:

networks:
  # Externa (no la crea este compose) para que otro stack de Docker en el
  # mismo VPS —una instancia de N8N, por ejemplo— pueda unirse a la misma
  # red y llegar a "db" y "backend" por su nombre de contenedor, sin exponer
  # Postgres a internet. Crearla una sola vez antes del primer
  # "docker compose up": `docker network create icr_internal`. Ver la
  # sección "Integración N8N / Telegram" del README para el paso a paso.
  icr_internal:
    external: true
  traefik_public:
    name: n8n_default
    external: true
    # Debe coincidir con el nombre de la red externa que ya usa Traefik en el VPS
